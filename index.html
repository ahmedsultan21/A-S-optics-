<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174c3b">
  <title>A&S Optics</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f8f6ef;color:#183d32}
    header{height:76px;background:#fffdf7;display:flex;align-items:center;justify-content:space-between;padding:0 6%;box-shadow:0 2px 12px #183d3210}
    .logo{direction:ltr;font-size:25px;font-weight:800;letter-spacing:1px;color:#174c3b}
    .icons{display:flex;align-items:center;gap:18px}
    .icon{border:0;background:transparent;color:#174c3b;cursor:pointer;font-size:21px}
    .hero{margin:28px auto;width:90%;min-height:390px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 85% 20%,#a8c5a8 0 10%,transparent 30%),linear-gradient(115deg,#123e31,#28634d);color:white;display:flex;align-items:center;justify-content:space-between;padding:55px 7%}
    .hero-content{max-width:520px}
    .hero small{color:#d8e8d5;font-size:15px}
    .hero h1{font-size:clamp(34px,5vw,54px);line-height:1.3;margin:18px 0}
    .hero p{color:#e2eee2;font-size:18px;line-height:1.8;margin-bottom:25px}
    .shop-btn{display:inline-block;background:#f5e9c9;color:#174c3b;padding:14px 30px;border-radius:30px;text-decoration:none;font-weight:bold}
    .glasses{direction:ltr;font-size:clamp(100px,18vw,190px);filter:drop-shadow(0 15px 15px #0005);transform:rotate(-10deg)}
    .features{width:90%;margin:35px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .feature{background:#fffdf7;border-radius:15px;padding:22px 12px;text-align:center;color:#245541;box-shadow:0 3px 15px #183d3208}
    .feature span{display:block;font-size:25px;margin-bottom:10px}
    .section-title{width:90%;margin:45px auto 20px;font-size:25px}
    .categories{width:90%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .category{background:#e9eee3;border-radius:18px;padding:30px 12px;text-align:center;font-weight:bold}
    .category span{display:block;font-size:38px;margin-bottom:12px}
    footer{margin-top:55px;background:#173e32;color:#fff;text-align:center;padding:25px;direction:ltr}
    @media(max-width:650px){
      header{height:65px;padding:0 5%}.logo{font-size:19px}.icons{gap:13px}
      .hero{min-height:420px;flex-direction:column;justify-content:center;text-align:center;padding:35px 20px}
      .glasses{font-size:105px;margin-top:20px}.features,.categories{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">A&amp;S Optics</div>
    <nav class="icons" aria-label="أدوات المتجر">
      <button class="icon" aria-label="بحث" title="بحث">⌕</button>
      <button class="icon" aria-label="حسابي" title="حسابي">♙</button>
      <button class="icon" aria-label="سلة المشتريات" title="سلة المشتريات">🛒</button>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-content">
        <small>WELCOME TO A&amp;S OPTICS</small>
        <h1>أناقتك تبدأ من نظرتك</h1>
        <p>اكتشف تشكيلتنا المميزة من النظارات الطبية والشمسية بتصاميم تجمع بين الأناقة والجودة.</p>
        <a class="shop-btn" href="#categories">تسوق الآن</a>
      </div>
      <div class="glasses" aria-hidden="true">👓</div>
    </section>
    <section class="features">
      <div class="feature"><span>🚚</span><strong>توصيل للمنزل</strong></div>
      <div class="feature"><span>💳</span><strong>طرق دفع متعددة</strong></div>
      <div class="feature"><span>⭐</span><strong>جودة وأناقة</strong></div>
    </section>
    <h2 class="section-title" id="categories">تسوق حسب القسم</h2>
    <section class="categories">
      <div class="category"><span>👓</span>نظارات طبية</div>
      <div class="category"><span>🕶️</span>نظارات شمسية</div>
      <div class="category"><span>✨</span>العدسات والإكسسوارات</div>
    </section>
  </main>
  <footer>A&amp;S Optics © 2026</footer>
<script>
  <!-- A&S Optics - Supabase Products -->
<style>
  #as-products {
    direction: rtl;
    padding: 25px 15px;
    font-family: Arial, sans-serif;
  }

  #as-products h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  #as-products-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .as-product {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    background: white;
  }

  .as-product img {
    width: 100%;
    height: 150px;
    object-fit: contain;
  }

  .as-product h3 {
    font-size: 16px;
    color: #244b3b;
  }

  .as-product p {
    font-weight: bold;
  }

  #as-products-status {
    text-align: center;
    padding: 15px;
  }
</style>

<section id="as-products">
  <h2>منتجاتنا</h2>
  <p id="as-products-status">جاري تحميل المنتجات...</p>
  <div id="as-products-grid"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function () {
  const url = "https://qoalzgicjnsqfrrsrcbf.supabase.co";
  const key = "sb_publishable_5gqiMH6Dur7D0YwF5Cddiw_-qypzf_J";

  const status = document.getElementById("as-products-status");
  const grid = document.getElementById("as-products-grid");

  try {
    const client = window.supabase.createClient(url, key);

    const { data, error } = await client
      .from("products")
      .select("name, price, image_url");

    if (error) throw error;

    if (!data || data.length === 0) {
      status.textContent = "لا توجد منتجات حتى الآن";
      return;
    }

    status.textContent = "";

    data.forEach(function (product) {
      const card = document.createElement("div");
      card.className = "as-product";

      if (product.image_url) {
        const img = document.createElement("img");
        img.src = product.image_url;
        img.alt = product.name || "منتج";
        card.appendChild(img);
      }

      const name = document.createElement("h3");
      name.textContent = product.name || "منتج";
      card.appendChild(name);

      const price = document.createElement("p");
      price.textContent = (product.price ?? 0) + " ريال";
      card.appendChild(price);

      grid.appendChild(card);
    });

  } catch (error) {
    status.textContent = "تعذر تحميل المنتجات: " + error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
